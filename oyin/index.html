<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{--navy:#0e3254;--paper:#f7f3ee;--line:#e6dccf;--muted:#6b6258;--gold:#e0b68e;--ok:#1f8a4c;--bad:#c2412d;
  --c0:#d64545;--c1:#2f6fd6;--c2:#d9a21b;--c3:#2e9e57}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--navy)}
.top{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 18px;border-bottom:3px solid var(--gold)}
.top img{width:34px;height:34px;border-radius:8px}
.top b{font-size:1.05rem}.top .sp{flex:1}
.top .tb{font:inherit;font-weight:600;font-size:.9rem;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 48px}
h1{margin:0 0 6px;font-size:1.7rem}h2{margin:0 0 8px}
.mu{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{font:inherit;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 14px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.u{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;cursor:pointer;font-weight:600;user-select:none}
.u input{width:18px;height:18px;margin:0;accent-color:var(--navy)}
.u.on{border-color:var(--navy);background:#eef2f7}
.u small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--navy);color:#fff;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gh{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:700;border:0;background:#fff;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
/* lobby */
.code{font-size:clamp(3.5rem,11vw,7.5rem);font-weight:900;letter-spacing:.12em;line-height:1;color:var(--navy);margin:8px 0}
.join{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media(max-width:800px){.join{grid-template-columns:1fr}}
.steps{font-size:1.15rem;line-height:1.7;margin:0;padding-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--navy);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.big-n{font-size:2.2rem;font-weight:900}
/* question */
.qhead{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:12px}
.timer{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#fff;background:var(--navy);flex:none}
.timer.low{background:var(--bad)}
.prompt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:800;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.prompt small{font-size:1.05rem;font-weight:600;color:var(--muted)}
.prompt .blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--navy)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;border-radius:14px;padding:20px 18px;color:#fff;font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:800;min-height:88px;transition:opacity .2s}
.opt .sh{font-size:1.6rem;width:38px;text-align:center;flex:none}
.opt .cnt{margin-left:auto;background:rgba(0,0,0,.22);border-radius:999px;padding:2px 12px;font-size:1.1rem}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2)}.o3{background:var(--c3)}
.opt.dim{opacity:.28}.opt.right{outline:5px solid #fff;box-shadow:0 0 0 9px var(--ok)}
.say{font:inherit;font-weight:700;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:10px 18px;cursor:pointer;font-size:1.1rem}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;font-size:1.25rem;font-weight:700}
.lb .pos{width:2em;color:var(--muted)}.lb .sc{margin-left:auto}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:18px 0 24px}
.pod div{width:min(28vw,230px);text-align:center;border-radius:14px 14px 0 0;color:#fff;padding:12px 8px;font-weight:800;display:flex;flex-direction:column;justify-content:flex-start;gap:6px}
.pod .p1{background:#c99a2e;min-height:240px}.pod .p2{background:#8a96a3;min-height:195px}.pod .p3{background:#a86b3c;min-height:160px}
.pod .nm{font-size:1.25rem;word-break:break-word}.pod .pt{font-size:1rem;opacity:.95}.pod .pl{font-size:2rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}.prog b{display:block;height:100%;background:var(--navy)}
</style>
</head>

const FB_VER = "10.12.2";
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms||15000))]); }
function isFake(){ try{ return !!(window.FAKE_DB || (window.parent && window.parent.FAKE_DB)); }catch(e){ return !!window.FAKE_DB; } }
async function openDB(){
  if(isFake()) return fakeDB();
  const base = "https://www.gstatic.com/firebasejs/"+FB_VER+"/";
  const [A, Au, D] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-database.js")]);
  const app = A.getApps().length ? A.getApp() : A.initializeApp(FB_CFG);
  const auth = Au.getAuth(app);
  const cred = auth.currentUser ? {user:auth.currentUser} : await Au.signInAnonymously(auth);
  const db = D.getDatabase(app);
  let offset = 0;
  D.onValue(D.ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
  const r = p => D.ref(db, p);
  return {
    uid: cred.user.uid,
    now: () => Date.now() + offset,
    TS: D.serverTimestamp(),
    get: async p => (await D.get(r(p))).val(),
    set: (p, v) => D.set(r(p), v),
    update: (p, v) => D.update(r(p), v),
    remove: p => D.remove(r(p)),
    on: (p, cb) => D.onValue(r(p), s => cb(s.val()), () => {}),
    onConn: cb => D.onValue(r(".info/connected"), s => cb(!!s.val()))
  };
}
/* --- soxta baza (faqat sinov uchun): localStorage + BroadcastChannel --- */
function fakeDB(){
  const KEY = "FAKEDB", ch = new BroadcastChannel("fakedb"), subs = [];
  let uid = sessionStorage.getItem("fake_uid"); if(!uid){ uid = "u"+Math.random().toString(36).slice(2,10); sessionStorage.setItem("fake_uid", uid); }
  const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } };
  const parts = p => String(p).split("/").filter(Boolean);
  const at = (o, p) => parts(p).reduce((x,k) => (x && typeof x === "object") ? x[k] : undefined, o);
  const fix = v => { if(v && typeof v === "object"){ if(v[".sv"]==="timestamp") return Date.now(); const o = Array.isArray(v)?[]:{}; for(const k in v) o[k] = fix(v[k]); return o; } return v; };
  const put = (o, p, v) => { const ks = parts(p); let x = o; ks.slice(0,-1).forEach(k => { if(!x[k] || typeof x[k] !== "object") x[k] = {}; x = x[k]; }); const last = ks[ks.length-1]; if(v === null || v === undefined) delete x[last]; else x[last] = v; };
  const notify = () => { const d = load(); subs.forEach(s => { const v = at(d, s.p); const j = JSON.stringify(v===undefined?null:v); if(j !== s.last){ s.last = j; s.cb(v===undefined?null:JSON.parse(j)); } }); };
  ch.onmessage = () => { notify(); setTimeout(notify, 60); setTimeout(notify, 300); };
  window.addEventListener("storage", () => notify());
  const write = fn => { const d = load(); fn(d); localStorage.setItem(KEY, JSON.stringify(d)); ch.postMessage(1); setTimeout(notify, 0); return Promise.resolve(); };
  return {
    uid, now: () => Date.now(), TS: {".sv":"timestamp"},
    get: async p => { const v = at(load(), p); return v===undefined ? null : JSON.parse(JSON.stringify(v)); },
    set: (p, v) => write(d => put(d, p, fix(v))),
    update: (p, v) => write(d => { for(const k in v) put(d, p+"/"+k, fix(v[k])); }),
    remove: p => write(d => put(d, p, null)),
    on: (p, cb) => { const s = {p, cb, last:undefined}; subs.push(s); setTimeout(notify, 0); return () => { const i = subs.indexOf(s); if(i>=0) subs.splice(i,1); }; },
    onConn: cb => cb(true)
  };
}

    let q;
    if(ty==="tr"){ const right=w[tr]; const o=shuf([right,...dist(x=>x[tr])]); q={type:ty,prompt:clean(w[0]),sub:G.lang==="ru"?"Переведите слово":"So‘zning tarjimasini toping",opts:o,c:o.indexOf(right),say:clean(w[0])}; }
    else if(ty==="rev"){ const right=clean(w[0]); const o=shuf([right,...dist(x=>clean(x[0]))]); q={type:ty,prompt:w[tr],sub:G.lang==="ru"?"Как это по-английски?":"Inglizchasini toping",opts:o,c:o.indexOf(right)}; }
    else if(ty==="sent"){ const tg=w[4].match(/\[([^\]]+)\]/)[1]; const cap=w[4].startsWith("["); const right=tg; const o=shuf([right,...dist(x=>{const m=(x[4]||"").match(/\[([^\]]+)\]/);let v=m?m[1]:clean(x[0]);if(m&&x[4].startsWith("["))v=v.charAt(0).toLowerCase()+v.slice(1);return cap?v.charAt(0).toUpperCase()+v.slice(1):v;})]);
      q={type:ty,prompt:w[4].replace(/\[[^\]]+\]/,"____"),sub:G.lang==="ru"?"Вставьте пропущенное слово":"Tushib qolgan so‘zni toping",opts:o,c:o.indexOf(right),say:w[4].replace(/\[|\]/g,"")}; }
    else { const right=clean(w[0]); const o=shuf([right,...dist(x=>clean(x[0]))]); q={type:"lis",prompt:"🔊",sub:G.lang==="ru"?"Послушайте и выберите слово":"Tinglang va eshitgan so‘zingizni tanlang",opts:o,c:o.indexOf(right),say:right}; }
    if(q.opts.length<4) continue;
    out.push(q);
  }
  return out;
}

/* ---------- 1. sozlash ---------- */
function viewSetup(err){
  const b=BOOKS.find(x=>x.code===G.book); const sel=G.sel[G.book]||(G.sel[G.book]=new Set());
  const total=Object.entries(G.sel).reduce((a,[bc,s])=>a+[...s].reduce((n,i)=>n+BOOKS.find(x=>x.code===bc).units[i].w.length,0),0);
  app.innerHTML=`<h1>Jonli o‘yin</h1><p class="mu" style="margin-top:0">O‘quvchilar telefonidan bir vaqtda javob beradi, tez va to‘g‘ri javob ko‘proq ball oladi. ${NQ} ta savol, har biriga ${DUR} soniya.</p>
  <div class="card"><h2>1. Unitlarni tanlang</h2>
   <div class="tabs">${BOOKS.map(x=>`<button class="tab${x.code===G.book?" on":""}" data-b="${x.code}">${esc(x.t)}${G.sel[x.code]&&G.sel[x.code].size?` (${G.sel[x.code].size})`:""}</button>`).join("")}</div>
   <div class="row" style="margin-bottom:10px"><button class="btn gh" id="all" style="padding:8px 14px;font-size:.95rem">Hammasini belgilash</button><button class="btn gh" id="none" style="padding:8px 14px;font-size:.95rem">Tozalash</button></div>
   <div class="units">${b.units.map((u,i)=>`<label class="u${sel.has(i)?" on":""}"><input type="checkbox" data-i="${i}"${sel.has(i)?" checked":""}><span>${esc(u.u)}<small>${u.w.length} ta so‘z</small></span></label>`).join("")}</div>
   <p class="mu" style="margin:12px 0 0">Tanlangan: <b>${total}</b> ta so‘z. Kamida 8 ta so‘z kerak.</p></div>
  <div class="card"><h2>2. Tarjima tili</h2><div class="seg"><button data-l="uz" class="${G.lang==="uz"?"on":""}">O‘zbekcha</button><button data-l="ru" class="${G.lang==="ru"?"on":""}">Русский</button></div></div>
  <p class="err">${esc(err||"")}</p>
  <button class="btn" id="mk"${total<8?" disabled":""}>O‘yin yaratish →</button>`;
  app.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{G.book=x.dataset.b;viewSetup();});
  app.querySelectorAll(".u input").forEach(x=>x.onchange=()=>{const i=+x.dataset.i; x.checked?sel.add(i):sel.delete(i); viewSetup();});
  document.getElementById("all").onclick=()=>{b.units.forEach((_,i)=>sel.add(i));viewSetup();};
  document.getElementById("none").onclick=()=>{sel.clear();viewSetup();};
  app.querySelectorAll(".seg button").forEach(x=>x.onclick=()=>{G.lang=x.dataset.l;viewSetup();});
  document.getElementById("mk").onclick=createGame;
}
async function createGame(){
  const btn=document.getElementById("mk"); btn.disabled=true; btn.textContent="Yaratilmoqda…";
  const pool=[]; Object.entries(G.sel).forEach(([bc,s])=>s.forEach(i=>pool.push(...BOOKS.find(x=>x.code===bc).units[i].w)));
  Q=makeQuestions(pool);
  if(Q.length<5){ viewSetup("Savol tuzish uchun so‘z yetarli emas. Ko‘proq unit tanlang."); return; }
  try{
    if(!db){ db=await withTimeout(openDB()); db.onConn(c=>{document.getElementById("conn").textContent=c?"● ulangan":"○ ulanish uzildi";}); }
    let nc=null;
    for(let k=0;k<10;k++){ const c=String(100000+Math.floor(Math.random()*900000)); const ex=await withTimeout(db.get("games/"+c+"/host")); if(!ex){ nc=c; break; } }
    if(!nc) throw new Error("code");
    code=nc;
    const units=Object.entries(G.sel).flatMap(([bc,s])=>[...s].map(i=>BOOKS.find(x=>x.code===bc).t+" "+BOOKS.find(x=>x.code===bc).units[i].u));
    await withTimeout(db.set("games/"+code,{host:db.uid,created:db.TS,info:{n:Q.length,dur:DUR,units:units.slice(0,40)},state:{phase:"lobby",qi:-1,n:Q.length}}));
    try{ sessionStorage.setItem("bis_game",JSON.stringify({code,Q})); }catch(e){}
    listen(); viewLobby();
  }catch(e){ console.error(e); code=null; const m=String(e&&e.code||e&&e.message||e); viewSetup(m==="timeout"?"O‘yin serveriga 15 soniyada ulanib bo‘lmadi. Internetni tekshirib, qayta urinib ko‘ring.":/permission|PERMISSION/i.test(m)?"O‘yin serveri ruxsat bermadi: Firebase xavfsizlik qoidalari qo‘yilmagan bo‘lishi mumkin.":"Serverga ulanib bo‘lmadi. Internetni tekshiring. ("+m+")"); }
}
function listen(){
  unsub.forEach(f=>{try{f()}catch(e){}}); unsub=[];
  unsub.push(db.on("games/"+code+"/players",v=>{players=v||{}; if(st&&st.phase==="lobby") viewLobby(); if(st&&st.phase==="q") updCount();}));
  unsub.push(db.on("games/"+code+"/scores",v=>{scores=v||{};}));
  unsub.push(db.on("games/"+code+"/state",v=>{st=v;}));
}
/* ---------- 2. lobby ---------- */
function viewLobby(){
  st=st||{phase:"lobby"};
  const names=Object.values(players).map(p=>p.name);
  app.innerHTML=`<div class="join"><div class="card"><div class="mu" style="font-weight:700">O‘yin kodi</div><div class="code">${code}</div>
   <ol class="steps"><li>Telefonda saytni oching: <b>${esc(SITE.replace("https://",""))}</b></li><li>Login bilan kiring va <b>🎮 Jonli o‘yin</b> ni bosing</li><li>Shu kodni yozing: <b>${code}</b></li></ol></div>
   <div class="card"><div class="row" style="justify-content:space-between"><div><span class="big-n">${names.length}</span> <span class="mu">ta o‘quvchi qo‘shildi</span></div>
   <button class="btn" id="go"${names.length?"":" disabled"}>Boshlash →</button></div>
   <div class="chips">${names.map(n=>`<span class="chip">${esc(n)}</span>`).join("")||`<span class="mu">O‘quvchilar kutilmoqda…</span>`}</div></div></div>
   <p class="mu">${Q.length} ta savol · har biriga ${DUR} soniya · tez va to‘g‘ri javobga 500–1000 ball, ketma-ket to‘g‘ri javoblarga qo‘shimcha ball.</p>
   <button class="btn gh" id="cancel">Bekor qilish</button>`;
  document.getElementById("go").onclick=()=>startQ(0);
  document.getElementById("cancel").onclick=async()=>{ if(!confirmBox("O‘yin bekor qilinsinmi?")) return; await db.update("games/"+code+"/state",{phase:"end",cancelled:true}); resetAll(); };
}
function confirmBox(t){ try{ return window.confirm(t); }catch(e){ return true; } }
function resetAll(){ unsub.forEach(f=>{try{f()}catch(e){}}); unsub=[]; code=null; Q=[]; players={}; scores={}; st=null; try{sessionStorage.removeItem("bis_game")}catch(e){} viewSetup(); }
/* ---------- 3. savol ---------- */
let qi=-1, qStart=0, revealed=false;
async function startQ(i){
  qi=i; revealed=false; answers={};
  const q=Q[i]; qStart=db.now();
  await db.update("games/"+code+"/state",{phase:"q",qi:i,n:Q.length,q:{type:q.type,prompt:q.prompt,sub:q.sub,opts:q.opts,say:q.say||null},qStart:qStart,dur:DUR,correct:null,counts:null});
  if(unsub.ans) unsub.ans();
  unsub.ans=db.on("games/"+code+"/answers/"+i,v=>{answers=v||{}; updCount();});
  viewQ(); if(q.say&&q.type==="lis") setTimeout(()=>speak(q.say),400);
  clearInterval(tick); tick=setInterval(()=>{ const left=Math.max(0,Math.ceil((qStart+DUR*1000-db.now())/1000)); const el=document.getElementById("tm"); if(el){ el.textContent=left; el.classList.toggle("low",left<=5); } if(left<=0) reveal(); },250);
}
function viewQ(){
  const q=Q[qi];
  app.innerHTML=`<div class="prog"><b style="width:${Math.round(qi*100/Q.length)}%"></b></div>
  <div class="qhead"><div><div class="mu" style="font-weight:700">${qi+1} / ${Q.length}-savol</div><div id="cnt" class="big-n" style="font-size:1.4rem"></div></div><div class="timer" id="tm">${DUR}</div></div>
  <div class="prompt">${q.type==="lis"?`<button class="say" id="say">🔊 Qayta eshittirish</button>`:esc(q.prompt).replace("____",'<span class="blank">&nbsp;</span>')}<small>${esc(q.sub)}</small></div>
  <div class="opts">${q.opts.map((o,k)=>`<div class="opt o${k}"><span class="sh">${SH[k]}</span><span>${esc(o)}</span></div>`).join("")}</div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn gh" id="skip">Vaqtni tugatish</button></div>`;
  const s=document.getElementById("say"); if(s) s.onclick=()=>speak(q.say);
  document.getElementById("skip").onclick=reveal;
  updCount();
}
function updCount(){ const el=document.getElementById("cnt"); if(!el) return; const n=Object.keys(answers).length, m=Object.keys(players).length; el.textContent=n+" / "+m+" javob berdi"; if(!revealed && m>0 && n>=m) setTimeout(reveal,600); }
async function reveal(){
  if(revealed) return; revealed=true; clearInterval(tick);
  if(unsub.ans){ unsub.ans(); unsub.ans=null; }
  const q=Q[qi], all=await db.get("games/"+code+"/answers/"+qi)||{}; answers=all;
  const counts=[0,0,0,0], upd={};
  const cur=JSON.parse(JSON.stringify(scores||{}));
  Object.keys(players).forEach(uid=>{
    const a=all[uid], s=cur[uid]||{s:0,st:0};
    let ok=false, pts=0;
    if(a && typeof a.a==="number" && a.a>=0 && a.a<4){
      const dt=Math.min(DUR*1000,Math.max(0,(a.t||0)-qStart));
      if((a.t||0)-qStart<=DUR*1000+1500){ counts[a.a]++; if(a.a===q.c){ ok=true; const streak=(s.st||0)+1; pts=Math.round(1000*(1-dt/(DUR*1000)/2))+Math.min(streak-1,5)*100; s.st=streak; } }
    }
    if(!ok) s.st=0;
    s.s=(s.s||0)+pts; s.last={qi:qi,ok:ok,pts:pts,a:a?a.a:-1};
    upd[uid]=s;
  });
  scores=upd;
  await db.set("games/"+code+"/scores",upd);
  await db.update("games/"+code+"/state",{phase:"reveal",correct:q.c,counts:counts});
  viewReveal(counts);
}
function ranking(){ return Object.keys(players).map(uid=>({uid,name:players[uid].name,s:(scores[uid]&&scores[uid].s)||0})).sort((a,b)=>b.s-a.s); }
function viewReveal(counts){
  const q=Q[qi], top=ranking().slice(0,5), last=qi===Q.length-1;
  app.innerHTML=`<div class="prog"><b style="width:${Math.round((qi+1)*100/Q.length)}%"></b></div>
  <div class="qhead"><div class="mu" style="font-weight:700">${qi+1} / ${Q.length}-savol · to‘g‘ri javob</div></div>
  <div class="prompt">${q.type==="lis"?esc(q.say):esc(q.say&&q.type==="sent"?q.say:q.prompt)}<small>${esc(q.sub)}</small></div>
  <div class="opts">${q.opts.map((o,k)=>`<div class="opt o${k} ${k===q.c?"right":"dim"}"><span class="sh">${k===q.c?"✓":SH[k]}</span><span>${esc(o)}</span><span class="cnt">${counts[k]}</span></div>`).join("")}</div>
  <div class="card" style="margin-top:16px"><h2>Eng yaxshi 5 talik</h2><ol class="lb">${top.map((p,i)=>`<li><span class="pos">${i+1}.</span>${esc(p.name)}<span class="sc">${p.s}</span></li>`).join("")}</ol></div>
  <button class="btn" id="nx">${last?"Natijalar →":"Keyingi savol →"}</button>`;
  document.getElementById("nx").onclick=()=> last ? finish() : startQ(qi+1);
}
/* ---------- 4. yakun ---------- */
async function finish(){
  await db.update("games/"+code+"/state",{phase:"end"});
  const r=ranking(); const p=[r[1],r[0],r[2]];
  const text="BIS English — Jonli o‘yin ("+new Date().toLocaleString("uz-UZ")+")\n"+r.map((x,i)=>(i+1)+". "+x.name+" — "+x.s).join("\n");
  app.innerHTML=`<h1 style="text-align:center">Natijalar</h1>
  <div class="pod">${p.map((x,i)=>x?`<div class="${["p2","p1","p3"][i]}"><div class="pl">${["🥈","🥇","🥉"][i]}</div><div class="nm">${esc(x.name)}</div><div class="pt">${x.s} ball</div></div>`:"").join("")}</div>
  <div class="card"><h2>Barcha o‘quvchilar</h2><ol class="lb">${r.map((x,i)=>`<li><span class="pos">${i+1}.</span>${esc(x.name)}<span class="sc">${x.s}</span></li>`).join("")}</ol></div>
  <div class="row"><button class="btn" id="cp">Natijalarni nusxalash</button><button class="btn gh" id="nw">Yangi o‘yin</button><span id="cpm" class="mu"></span></div>`;
  document.getElementById("cp").onclick=()=>{ try{ navigator.clipboard.writeText(text).then(()=>document.getElementById("cpm").textContent="Nusxa olindi — Telegramga joylashtiring."); }catch(e){} };
  document.getElementById("nw").onclick=resetAll;
}
viewSetup();
</script>
