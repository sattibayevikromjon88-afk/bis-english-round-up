<style>
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
:root{--navy:#0e3254;--paper:#f7f3ee;--card:#fff;--line:#e6dccf;--muted:#6b6258;--gold:#e0b68e;--soft:#f6ebdc;--ok:#1f8a5b;--okb:#e2f4ea;--bad:#c2412d;--badb:#fbe7e3;--warn:#a86a14;--warnb:#fbf0dc}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--navy);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);padding:10px max(3vw,14px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top img{width:34px;height:34px;border-radius:8px}
.top b{font-size:17px}
.top .sp{flex:1}
.top .who{color:var(--gold);font-size:14px}
.tb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.tb:hover{background:rgba(255,255,255,.24)}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(3vw,14px) 60px}
.login{max-width:380px;margin:9vh auto 0;text-align:center}
.login img{width:96px;height:96px;border-radius:20px;box-shadow:0 6px 20px rgba(14,50,84,.25)}
.login h1{margin:12px 0 2px;font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.login .card{text-align:left;margin-top:18px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
input[type=password],input[type=text],input[type=search],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.btn{width:100%;border:0;border-radius:12px;padding:13px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 0 0}
.mu{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .n{display:inline-block;margin-left:6px;background:var(--badb);color:var(--bad);border-radius:999px;padding:0 8px;font-size:12px}
.tab.on .n{background:rgba(255,255,255,.2);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:end}
.tools>div{flex:1 1 200px}
.scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;background:var(--navy);color:#fff;font-size:12px;letter-spacing:.03em;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)}.p-bad{background:var(--badb);color:var(--bad)}.p-warn{background:var(--warnb);color:var(--warn)}.p-mu{background:#eee8df;color:var(--muted)}
.prog{display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prog i{display:block;width:54px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i b{display:block;height:100%;background:var(--navy)}
.back{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0 14px}
.book{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.book .t{font-weight:700}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar b{display:block;height:100%;background:var(--navy)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--badb);color:var(--bad);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
.words span small{color:var(--muted);font-weight:500;margin-left:4px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;background:#fff;border:1px solid var(--line)}
.alert b{white-space:nowrap}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
.printable{display:none}
.newst{border:2px solid var(--ok);background:var(--okb);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.newst .cred{font-size:22px;font-weight:800;letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1 1 220px}
.sbtn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.sbtn.dng{color:var(--bad);border-color:#efc4be}
.sbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ok{color:var(--ok);font-weight:600;font-size:14px;min-height:20px;margin:8px 0 0}
@media print{
  .top,.tabs,.tools,.back,#app>*:not(.printzone){display:none!important}
  body{background:#fff;color:#000}
  .printzone{display:block!important}
  .printzone table{font-size:13px}
  .printzone th{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .printzone td{border-top:1px solid #000}
}
@media(max-width:600px){.kpi .v{font-size:24px}td,th{padding:8px 7px}}
</style>
</head>

const CHAPTERS = ["The Four Strangers", "Aziz and the Apple Tree", "A Very Bad Summer", "Kamol and the Blue Bag", "One Hundred Bags", "Rustam’s Five Loaves", "The Red Door Café", "Bekzod’s First Customer", "The Wrong Address", "A New Idea", "The Price of Lunch", "Before the Last Station", "Four Friends in Tashkent"];
const TENSES = ["To be (am / is / are)", "Present Simple", "Present Continuous", "Present Simple yoki Present Continuous", "Be going to", "Past Simple: was / were", "Past Simple: had / could", "Past Simple: to‘g‘ri fe’llar", "Past Simple: noto‘g‘ri fe’llar", "Simple Future (will)"];

function fmtDate(t){ if(!t) return "—"; const d=new Date(t); const p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function ago(t){ if(!t) return "hech qachon"; const m=Math.floor((Date.now()-t)/60000); if(m<1) return "hozirgina"; if(m<60) return m+" daqiqa oldin"; const h=Math.floor(m/60); if(h<24) return h+" soat oldin"; const d=Math.floor(h/24); return d+" kun oldin"; }
function section(r){
  const b = BOOKS.find(x=>x.app===r.app);
  if(b){ const m=String(r.unit).match(/Unit\s+(\d+)/); return {kind:"lugat", book:b.code, unit:m?+m[1]:0}; }
  if(/^Reading/.test(r.app)){ const m=String(r.unit).match(/Chapter\s+(\d+)/); return {kind:"reading", ch:m?+m[1]:0}; }
  if(/^Zamonlar/.test(r.app)){ return {kind:"tense", topic:r.app.replace(/^Zamonlar\s*·\s*/,"")}; }
  return {kind:"other"};
}
const isPass = r => String(r.passed).toLowerCase()==="ha" || String(r.passed)==="true";
const isAdmin = () => D && D.role==="admin";
/* O'quvchi ism-familiyasi bo'yicha aniqlanadi (katta-kichik harf, ortiqcha bo'sh joy va tutuq belgisi farqi hisobga olinmaydi) */
const normName = (f,l) => (String(f||"")+" "+String(l||"")).toLowerCase().replace(/[‘’ʻʼ`´]/g,"'").replace(/\s+/g," ").trim();
const keyOf = r => String(r.tid||"")+"|"+normName(r.f,r.l);
let T = {};
const tName = id => (T[id]&&T[id].name)||"—";

function analyse(){
  const st = {};
  D.results.forEach(r=>{ const k=keyOf(r); if(!st[k]) st[k]={key:k, tid:String(r.tid||""), login:String(r.u||""), rows:[]}; st[k].rows.push(r); });
  Object.values(st).forEach(s=>{
    s.rows.sort((a,b)=>a.t-b.t);
    const lr=s.rows[s.rows.length-1];
    s.name = (lr.f+" "+lr.l).trim().replace(/\s+/g," ");
    s.login = lr.u;
    s.last = lr.t; s.first = s.rows[0].t;
    s.week = s.rows.filter(r=>Date.now()-r.t<7*DAY).length;
    s.book = {}; BOOKS.forEach(b=>s.book[b.code]={done:0, units:{}});
    s.chapters = {}; s.tenses = {}; s.wrong = {};
    s.rows.forEach(r=>{
      const x = section(r);
      if(x.kind==="lugat"){
        const B=s.book[x.book], U=B.units[x.unit]||(B.units[x.unit]={tries:0,best:0,max:r.max,passed:false,last:0});
        U.tries++; U.best=Math.max(U.best,+r.score||0); U.max=r.max||U.max; U.last=r.t; if(isPass(r)) U.passed=true;
        String(r.wrong||"").split(",").map(w=>w.trim()).filter(Boolean).forEach(w=>{ s.wrong[w]=(s.wrong[w]||0)+1; });
      } else if(x.kind==="reading"){
        const C=s.chapters[x.ch]||(s.chapters[x.ch]={tries:0,best:0,passed:false,last:0});
        C.tries++; C.best=Math.max(C.best,+r.score||0); C.last=r.t; if(isPass(r)) C.passed=true;
      } else if(x.kind==="tense"){
        const Tt=s.tenses[x.topic]||(s.tenses[x.topic]={tries:0,best:0,lastScore:0,last:0});
        Tt.tries++; Tt.best=Math.max(Tt.best,+r.pct||0); Tt.lastScore=+r.pct||0; Tt.last=r.t;
      }
    });
    BOOKS.forEach(b=>{ const B=s.book[b.code]; let n=0; while(B.units[n+1]&&B.units[n+1].passed) n++; B.done=n; });
    s.readDone = 0; while(s.chapters[s.readDone+1]&&s.chapters[s.readDone+1].passed) s.readDone++;
    const tv=Object.values(s.tenses); s.tenseCount=tv.length; s.tenseAvg=tv.length?Math.round(tv.reduce((a,t)=>a+t.best,0)/tv.length):null;
    s.stuck = [];
    BOOKS.forEach(b=>{ Object.entries(s.book[b.code].units).forEach(([u,U])=>{ if(!U.passed && U.tries>=3) s.stuck.push(b.t+", Unit "+u+" — "+U.tries+" marta urindi, eng yaxshi "+U.best+"/"+U.max); }); });
    Object.entries(s.chapters).forEach(([c,C])=>{ if(!C.passed && C.tries>=3) s.stuck.push("Reading, "+c+"-bob — "+C.tries+" marta urindi, eng yaxshi "+C.best+"/12"); });
  });
  return st;
}

async function api(a,extra){
  const r = await fetch(SERVER_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({a:a,p:pass},extra||{}))});
  return await r.json();
}

async function load(keepView){

function progCell(n,total){ const p=total?Math.round(n*100/total):0; return `<span class="prog">${n}/${total}<i><b style="width:${p}%"></b></i></span>`; }

function attention(){

    s.stuck.forEach(t=>out.push({s,type:"stuck",t}));
    if(Date.now()-s.last>=3*DAY) out.push({s,type:"idle",t:Math.floor((Date.now()-s.last)/DAY)+" kundan beri kirmagan"});
  });
  return out;
}

  return `${nw}<form class="card" id="addf" style="margin-bottom:12px"><h3>Yangi ustoz qo‘shish</h3><p class="mu" style="margin-top:0">Ustozga panel paroli va uning o‘quvchilari uchun bitta login-parol avtomatik yaratiladi.</p><div class="row"><div><label for="nn">Ustoz ism-familiyasi</label><input type="text" id="nn" placeholder="Masalan: Malika Karimova" maxlength="60"></div><div><label for="ph">Telefon (ixtiyoriy)</label><input type="text" id="ph" placeholder="+998 90 123 45 67" maxlength="40"></div><div style="flex:0 0 auto"><button class="sbtn pri" id="addb" style="padding:11px 16px">Ustoz qo‘shish</button></div></div><p class="err" id="adder"></p><p class="ok">${esc(flash)}</p></form>
  <div class="scroll"><table><thead><tr><th>Ustoz</th><th>O‘quvchilar logini</th><th>O‘quvchilar paroli</th><th>Panel paroli</th><th>Holat</th><th style="text-align:right">O‘quvchilar</th><th>Amallar</th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="empty">Hali ustoz yo‘q. Yuqoridan qo‘shing.</td></tr>`}</tbody></table></div>
  <p class="mu" style="margin-top:8px">“Yangi o‘quvchi paroli” — shu ustozning hamma o‘quvchilari saytdan chiqariladi va yangi parol bilan kiradi. “O‘chirish” — ustoz panelga, uning o‘quvchilari saytga kira olmaydi; natijalar saqlanib qoladi.</p>`;
}
function settingsView(){
  return `<form class="card" id="cpf" style="max-width:460px"><h3>Parolni o‘zgartirish</h3>
  <label for="cp1">Yangi parol (kamida 6 ta belgi)</label><input type="password" id="cp1" autocomplete="new-password">
  <label for="cp2" style="margin-top:10px">Yangi parolni takrorlang</label><input type="password" id="cp2" autocomplete="new-password">
  <p class="err" id="cper"></p><p class="ok">${esc(flash)}</p><button class="btn" id="cpb" style="width:auto;padding:11px 18px">Saqlash</button></form>`;
}
async function teacherAction(act,id){
  const t=T[id]; if(!t) return;
  let extra={id:id};
  if(act==="rename"){ const nv=await askText("Ustoz ism-familiyasi",t.name); if(nv==null) return; if(nv.trim().length<3){ alertBox(ERR.name); return; } const ph=await askText("Telefon (bo‘sh qoldirsa bo‘ladi)",t.phone||""); if(ph==null) return; extra.name=nv.trim(); extra.phone=ph.trim(); }
  if(act==="resetStudent"){ if(!(await askConfirm(t.name+" o‘quvchilari uchun yangi parol yaratilsinmi? Eski parol ishlamay qoladi va uning hamma o‘quvchilari saytdan chiqariladi."))) return; extra.resetStudent=true; }
  if(act==="resetPanel"){ if(!(await askConfirm(t.name+" uchun yangi panel paroli yaratilsinmi? Eski panel paroli ishlamay qoladi."))) return; extra.resetPanel=true; }
  if(act==="off"){ if(!(await askConfirm(t.name+" o‘chirilsinmi? Ustoz panelga, uning o‘quvchilari saytga kira olmaydi. Natijalar saqlanib qoladi."))) return; extra.active=false; }
  if(act==="on"){ extra.active=true; }
  try{ const r=await api("updTeacher",extra); if(!r.ok){ alertBox(ERR[r.err]||ERR.server); return; }
    flash = act==="resetStudent" ? (t.name+" o‘quvchilari uchun yangi parol: "+r.pass) : act==="resetPanel" ? (t.name+" uchun yangi panel paroli: "+r.panelPass) : act==="rename" ? "Saqlandi." : act==="off" ? (t.name+" o‘chirildi.") : (t.name+" faollashtirildi.");
    lastNew=null; await load(true); flash="";
  }catch(e){ alertBox(ERR.net); }
}
/* brauzer oynalari (alert/confirm/prompt) o'rniga sahifaning o'z oynasi */
function modal(html){ return new Promise(res=>{ const w=document.createElement("div"); w.style.cssText="position:fixed;inset:0;background:rgba(14,50,84,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px";
  w.innerHTML=`<div class="card" style="max-width:420px;width:100%">${html}<div class="acts" style="justify-content:flex-end;margin-top:14px"><button class="sbtn" data-r="0">Bekor qilish</button><button class="sbtn pri" data-r="1">Tasdiqlash</button></div></div>`;
  document.body.appendChild(w); const inp=w.querySelector("input"); if(inp){ inp.focus(); inp.select(); inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); w.querySelector('[data-r="1"]').click(); } }; }
  w.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const ok=b.dataset.r==="1"; const v=inp?inp.value:true; w.remove(); res(ok?v:null); }); }); }
async function askConfirm(t){ return (await modal(`<p style="margin:0">${esc(t)}</p>`))!==null; }
async function askText(t,v){ return await modal(`<label>${esc(t)}</label><input type="text" value="${esc(v)}" maxlength="60">`); }
function detail(u){
  const s=S[u]; if(!s){ sel=null; return render(); }
  const bk=BOOKS.map(b=>{const B=s.book[b.code],p=Math.round(B.done*100/b.units);return `<div class="book"><div class="t">${b.t}</div><div class="bar"><b style="width:${p}%"></b></div><div class="mu">${B.done} / ${b.units} unit yodlangan</div></div>`;}).join("")
   +`<div class="book"><div class="t">Reading</div><div class="bar"><b style="width:${Math.round(s.readDone*100/CHAPTERS.length)}%"></b></div><div class="mu">${s.readDone} / ${CHAPTERS.length} bob tugatilgan</div></div>`
   +`<div class="book"><div class="t">Zamonlar</div><div class="bar"><b style="width:${Math.round(s.tenseCount*100/TENSES.length)}%"></b></div><div class="mu">${s.tenseCount} / ${TENSES.length} mavzu ishlangan${s.tenseAvg!=null?", o‘rtacha "+s.tenseAvg+"%":""}</div></div>`;
  const unitRows=BOOKS.flatMap(b=>Object.entries(s.book[b.code].units).sort((x,y)=>+x[0]-+y[0]).map(([n,U])=>`<tr><td>${b.t}</td><td>Unit ${n}</td><td class="num">${U.tries}</td><td class="num">${U.best}/${U.max}</td><td>${U.passed?'<span class="pill p-ok">yodlandi</span>':U.tries>=3?'<span class="pill p-bad">qiynalyapti</span>':'<span class="pill p-warn">jarayonda</span>'}</td><td>${esc(fmtDate(U.last))}</td></tr>`)).join("");
  const chRows=CHAPTERS.map((t,i)=>{const C=s.chapters[i+1]; return C?`<tr><td>${i+1}. ${esc(t)}</td><td class="num">${C.tries}</td><td class="num">${C.best}/12</td><td>${C.passed?'<span class="pill p-ok">tugatildi</span>':'<span class="pill p-warn">qayta</span>'}</td></tr>`:"";}).join("");
  const tRows=TENSES.map(t=>{const Tt=s.tenses[t]; return `<tr><td>${esc(t)}</td><td class="num">${Tt?Tt.tries:"—"}</td><td class="num">${Tt?Tt.best+"%":"—"}</td><td class="num">${Tt?Tt.lastScore+"%":"—"}</td></tr>`;}).join("");
  const words=Object.entries(s.wrong).sort((a,b)=>b[1]-a[1]).slice(0,40);
  const hist=[...s.rows].sort((a,b)=>b.t-a.t).slice(0,200);
  app.innerHTML=`<button class="back" id="bk">← O‘quvchilar ro‘yxati</button>
  <div class="card"><h2>${esc(s.name)}</h2><div class="mu">Ustoz: <b>${esc(tName(s.tid))}</b> · Login: ${esc(s.login)} · Birinchi mashq: ${esc(fmtDate(s.first))} · Oxirgi faollik: ${esc(fmtDate(s.last)+" ("+ago(s.last)+")")} · Jami urinishlar: ${s.rows.length}</div>
  ${s.stuck.length?`<div style="margin-top:10px">${s.stuck.map(t=>`<div class="alert"><span class="pill p-bad">Qiynalyapti</span><div>${esc(t)}</div></div>`).join("")}</div>`:""}
  <div class="books">${bk}</div></div>
  <div class="grid2" style="margin-top:14px">
   <div class="card"><h3>Lug‘at unitlari</h3>${unitRows?`<div class="scroll"><table><thead><tr><th>Kitob</th><th>Unit</th><th style="text-align:right">Urinish</th><th style="text-align:right">Eng yaxshi</th><th>Holat</th><th>Oxirgi</th></tr></thead><tbody>${unitRows}</tbody></table></div>`:'<div class="empty">Hali lug‘at mashqi ishlanmagan.</div>'}</div>
   <div class="card"><h3>Ko‘p xato qilingan so‘zlar</h3>${words.length?`<div class="words">${words.map(([w,n])=>`<span>${esc(w)}<small>×${n}</small></span>`).join("")}</div>`:'<div class="empty">Xato so‘zlar yo‘q.</div>'}</div>
   <div class="card"><h3>Reading</h3>${chRows?`<div class="scroll"><table><thead><tr><th>Bob</th><th style="text-align:right">Urinish</th><th style="text-align:right">Eng yaxshi</th><th>Holat</th></tr></thead><tbody>${chRows}</tbody></table></div>`:'<div class="empty">Hali Reading ishlanmagan.</div>'}</div>
   <div class="card"><h3>Zamonlar</h3><div class="scroll"><table><thead><tr><th>Mavzu</th><th style="text-align:right">Urinish</th><th style="text-align:right">Eng yaxshi</th><th style="text-align:right">Oxirgi</th></tr></thead><tbody>${tRows}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Barcha urinishlar${s.rows.length>200?" (oxirgi 200 tasi)":""}</h3><div class="scroll"><table><thead><tr><th>Sana</th><th>Bo‘lim</th><th>Mavzu</th><th style="text-align:right">Ball</th><th style="text-align:right">Foiz</th><th>Holat</th><th>Xato so‘zlar</th></tr></thead><tbody>${hist.map(r=>resultRow(r,false)).join("")||`<tr><td colspan="7" class="empty">Hali urinish yo‘q.</td></tr>`}</tbody></table></div></div>`;
  document.getElementById("bk").onclick=()=>{sel=null; render();};
  window.scrollTo(0,0);
}
function bind(){
  const qi=document.getElementById("q");
  if(qi){ qi.oninput=()=>{ q=qi.value; const pos=qi.selectionStart; render(); const n=document.getElementById("q"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }; }
  const ff=document.getElementById("ff"); if(ff) ff.onchange=()=>{ feedFilter=ff.value; render(); };
  const tfs=document.getElementById("tf"); if(tfs) tfs.onchange=()=>{ tf=tfs.value; render(); };
  app.querySelectorAll("th.sort").forEach(t=>t.onclick=()=>{ const k=t.dataset.s; if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=(k==="teacher"||k==="name")?1:-1; } render(); });
  app.querySelectorAll("tr.click").forEach(r=>r.onclick=()=>{ sel=r.dataset.u; render(); });
  app.querySelectorAll("a[data-u]").forEach(a=>a.onclick=e=>{ e.preventDefault(); sel=a.dataset.u; render(); });
  const pp=document.getElementById("pp"); if(pp) pp.onclick=()=>{ try{ window.print(); }catch(e){} };
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>teacherAction(b.dataset.act,b.dataset.l));
  const af=document.getElementById("addf");
  if(af) af.onsubmit=async e=>{ e.preventDefault(); const nn=document.getElementById("nn"), er=document.getElementById("adder"); const nm=nn.value.trim();
    if(nm.split(/\s+/).length<2||nm.length<5){ er.textContent="Ustozning ism va familiyasini to‘liq yozing."; nn.focus(); return; }
    document.getElementById("addb").disabled=true;
    try{ const r=await api("addTeacher",{name:nm,phone:document.getElementById("ph").value.trim()}); if(!r.ok){ er.textContent=ERR[r.err]||ERR.server; document.getElementById("addb").disabled=false; return; }
      lastNew=r.teacher; await load(true);
    }catch(e2){ er.textContent=ERR.net; document.getElementById("addb").disabled=false; } };
  const cpf=document.getElementById("cpf");
  if(cpf) cpf.onsubmit=async e=>{ e.preventDefault(); const a=document.getElementById("cp1").value.trim(), b3=document.getElementById("cp2").value.trim(), er=document.getElementById("cper");
    if(a.length<6){ er.textContent=ERR.short; return; } if(a!==b3){ er.textContent="Ikkala parol bir xil emas."; return; }
    try{ const r=await api("pchange",{np:a}); if(!r.ok){ er.textContent=ERR[r.err]||ERR.server; return; } pass=a; try{ sessionStorage.setItem("bis_teacher",pass); }catch(e3){} flash="Parol o‘zgartirildi. Keyingi safar yangi parol bilan kirasiz."; render(); flash=""; }
    catch(e2){ er.textContent=ERR.net; } };
}
start();
}
</script>
